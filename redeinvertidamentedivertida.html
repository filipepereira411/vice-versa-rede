<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Acesso Inverso ao Meu PC</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .btn { display: inline-block; padding: 10px 20px; margin: 10px; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .web { background-color: #e67e22; }
        .ssh { background-color: #8e44ad; }
        .rdp { background-color: #c0392b; }
    </style>
</head>
<body>

    <h2>Ligar de volta para o Meu Computador</h2>
    <p>Clique abaixo para aceder ao computador que gerou esta página.</p>

    <!-- Substitua 'SEU_IP_ATUAL' pelo IP da sua máquina local -->
    <a href="http://SEU_IP_ATUAL" target="_blank" class="btn web">Aceder à minha Interface Web</a>
    <a href="ssh://SEU_IP_ATUAL" class="btn ssh">Ligar ao meu SSH</a>
    <a href="rdp://SEU_IP_ATUAL" class="btn rdp">Ligar ao meu RDP (Windows)</a>

</body>
</html>
